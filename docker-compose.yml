# CoinVigil stack: API + web + optional Redis cache.
# Postgres is intentionally omitted — this build does not persist to a database.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - coinvigil_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_FACTORY_ETHEREUM: ${NEXT_PUBLIC_FACTORY_ETHEREUM:-}
        NEXT_PUBLIC_FACTORY_BASE: ${NEXT_PUBLIC_FACTORY_BASE:-}
        NEXT_PUBLIC_FACTORY_BSC: ${NEXT_PUBLIC_FACTORY_BSC:-}
        NEXT_PUBLIC_FACTORY_POLYGON: ${NEXT_PUBLIC_FACTORY_POLYGON:-}
        NEXT_PUBLIC_FACTORY_ARBITRUM: ${NEXT_PUBLIC_FACTORY_ARBITRUM:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  coinvigil_redis:
