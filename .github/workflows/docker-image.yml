name: CoinVigil CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Python syntax
        run: python -m compileall -q apps/api/app apps/api/tests

      - name: Validate Docker Compose configuration
        run: docker compose config > /tmp/coinvigil-compose.yml

      - name: Build API image
        run: docker build --pull --tag coinvigil-api:test ./apps/api

      - name: Test AI Council consensus logic
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i coinvigil-api:test python - <<'PY'
          from app.config import Settings
          from app.models import AIProviderResult
          from app.services.ai import _consensus
          settings = Settings(_env_file=None, ai_provider_weights_json='{"openai":1.2,"xai":1.0,"gemini":1.0}')
          results = [
              AIProviderResult(provider='openai', model='test-openai', status='ok', bias='bullish', confidence=82, summary='bullish'),
              AIProviderResult(provider='xai', model='test-xai', status='ok', bias='bullish', confidence=76, summary='bullish'),
              AIProviderResult(provider='gemini', model='test-gemini', status='ok', bias='bearish', confidence=55, summary='bearish'),
          ]
          decision = _consensus(results, ['openai', 'xai', 'gemini'], settings)
          assert decision and decision.bias == 'bullish', decision
          assert decision.votes == {'bullish': 2, 'bearish': 1, 'neutral': 0}, decision
          conflict = [
              AIProviderResult(provider='openai', model='a', status='ok', bias='bullish', confidence=80, summary='bullish'),
              AIProviderResult(provider='xai', model='b', status='ok', bias='bearish', confidence=80, summary='bearish'),
          ]
          conflict_decision = _consensus(conflict, ['openai', 'xai'], Settings(_env_file=None))
          assert conflict_decision and conflict_decision.bias == 'neutral', conflict_decision
          print('AI Council consensus tests passed')
          PY

      - name: Test xAI Grok provider wiring
        run: docker run --rm coinvigil-api:test python -m unittest discover -s tests -v

      - name: Build token contracts
        working-directory: contracts
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -n "$(find build -name '*.bin' -type f -size +0c -print -quit)"
          test -n "$(find build -name '*.abi' -type f -size +0c -print -quit)"

      - name: Validate factory deployment helper
        working-directory: contracts
        run: node --check scripts/deploy-factory.mjs

      - name: Test contract deployment safety
        working-directory: contracts
        run: npm test

      - name: Build web image
        run: docker build --pull --tag coinvigil-web:test ./apps/web

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for API health
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Smoke test API endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "http://127.0.0.1:8000/api/market?limit=3" > /tmp/market.json
          curl -fsS "http://127.0.0.1:8000/api/radar?limit=3" > /tmp/radar.json
          curl -fsS "http://127.0.0.1:8000/api/assets/bitcoin/analysis" > /tmp/analysis.json
          curl -fsS "http://127.0.0.1:8000/api/assets/bitcoin/candles?days=7" > /tmp/candles.json
          curl -fsS "http://127.0.0.1:8000/api/news?limit=3" > /tmp/news.json
          curl -fsS "http://127.0.0.1:8000/api/ai/council/status" > /tmp/council-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('/tmp/health.json').read_text())
          market = json.loads(Path('/tmp/market.json').read_text())
          analysis = json.loads(Path('/tmp/analysis.json').read_text())
          candles = json.loads(Path('/tmp/candles.json').read_text())
          council_status = json.loads(Path('/tmp/council-status.json').read_text())
          assert health.get('status') == 'ok', health
          assert isinstance(market.get('data'), list) and market['data'], market
          assert analysis.get('asset', {}).get('id') == 'bitcoin', analysis
          assert isinstance(candles.get('data'), list) and candles['data'], candles
          candle = candles['data'][0]
          assert all(key in candle for key in ('timestamp','open','high','low','close')), candle
          assert council_status.get('enabled') is True, council_status
          assert council_status.get('supported', 0) >= 9, council_status
          providers = {item['provider']: item for item in council_status.get('providers', [])}
          assert 'xai' in providers, council_status
          assert providers['xai'].get('label') == 'xAI Grok', providers['xai']
          assert providers['xai'].get('model') == 'grok-4.6', providers['xai']
          assert providers['xai'].get('optional') is True, providers['xai']
          assert providers['xai'].get('configured') is False, providers['xai']
          assert providers['xai'].get('endpoint') == 'https://api.x.ai/v1/chat/completions', providers['xai']
          print('API, candle and AI Council smoke tests passed')
          PY

      - name: Smoke test web application
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if ! curl -fsS http://127.0.0.1:3000/ > /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! grep -q "CoinVigil" /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! grep -q "xAI Grok" /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! curl -fsS http://127.0.0.1:3000/asset/bitcoin > /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! grep -q "PRO CHART LAB" /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! curl -fsS http://127.0.0.1:3000/token-studio > /tmp/token-studio.html; then
              sleep 2
              continue
            fi
            if ! grep -q "Token Studio" /tmp/token-studio.html; then
              sleep 2
              continue
            fi
            echo "Web, Chart Lab and Token Studio smoke tests passed"
            exit 0
          done
          exit 1

      - name: Verify running services
        run: docker compose ps

      - name: Print container logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=300 || true

      - name: Clean up
        if: always()
        run: docker compose down -v --remove-orphans
