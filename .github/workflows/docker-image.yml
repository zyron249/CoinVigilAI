name: CoinVigil CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Prepare environment
        run: cp .env.example .env

      - name: Scan for committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -nE 'sk-[A-Za-z0-9]{20,}|sk-ant-|xai-[A-Za-z0-9]{20,}|-----BEGIN ([A-Z ]+)?PRIVATE KEY-----' -- ':!.github/**' ':!README.md' ':!.env.example'; then
            echo "Possible secret material found in the repository"
            exit 1
          fi
          echo "No obvious committed secrets"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API test dependencies
        run: pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt

      - name: Run API unit tests
        working-directory: apps/api
        run: python -m pytest -q

      - name: Check local watchlist contract
        run: node --test apps/web/lib/watchlist-contract.test.mjs apps/web/lib/project-links-contract.test.mjs

      - name: Validate Python syntax
        run: python -m compileall -q apps/api/app apps/api/tests

      - name: Validate Docker Compose configuration
        run: |
          docker compose config --services | tee /tmp/compose-services.txt
          if grep -qx postgres /tmp/compose-services.txt; then
            echo "Postgres must not be started; this build does not use it"
            exit 1
          fi
          docker compose config > /tmp/coinvigil-compose.yml

      - name: Build API image
        run: docker build --pull --tag coinvigil-api:test ./apps/api

      - name: Build token contracts
        working-directory: contracts
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -n "$(find build -name '*.bin' -type f -size +0c -print -quit)"
          test -n "$(find build -name '*.abi' -type f -size +0c -print -quit)"

      - name: Validate factory deployment helper
        working-directory: contracts
        run: node --check scripts/deploy-factory.mjs

      - name: Test contract deployment safety
        working-directory: contracts
        run: npm test

      - name: Build web image
        run: docker build --pull --tag coinvigil-web:test ./apps/web

      - name: Start full stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Wait for API health
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Smoke test API endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "http://127.0.0.1:8000/api/market?limit=3" > /tmp/market.json
          curl -fsS "http://127.0.0.1:8000/api/market/global" > /tmp/global.json
          curl -fsS "http://127.0.0.1:8000/api/market/movers?limit=3" > /tmp/movers.json
          curl -fsS "http://127.0.0.1:8000/api/market/brief" > /tmp/brief.json
          curl -fsS "http://127.0.0.1:8000/api/radar?limit=3" > /tmp/radar.json
          curl -fsS "http://127.0.0.1:8000/api/assets/bitcoin/analysis" > /tmp/analysis.json
          curl -fsS "http://127.0.0.1:8000/api/assets/bitcoin/candles?days=7" > /tmp/candles.json
          curl -fsS "http://127.0.0.1:8000/api/assets/bitcoin/tickers?limit=5&sort=trust&order=desc" > /tmp/tickers.json
          curl -fsS "http://127.0.0.1:8000/api/assets/bitcoin/profile" > /tmp/profile.json
          curl -fsS "http://127.0.0.1:8000/api/compare?ids=bitcoin,ethereum,not-a-real-coin" > /tmp/compare.json
          curl -fsS "http://127.0.0.1:8000/api/news?limit=3" > /tmp/news.json
          curl -fsS "http://127.0.0.1:8000/api/ai/council/status" > /tmp/council-status.json
          curl -fsS "http://127.0.0.1:8000/api/status" > /tmp/status.json
          python - <<'PY'
          import json
          from pathlib import Path
          allowed_sources = {'coingecko', 'cache', 'demo'}
          health = json.loads(Path('/tmp/health.json').read_text())
          market = json.loads(Path('/tmp/market.json').read_text())
          global_overview = json.loads(Path('/tmp/global.json').read_text())
          movers = json.loads(Path('/tmp/movers.json').read_text())
          brief = json.loads(Path('/tmp/brief.json').read_text())
          analysis = json.loads(Path('/tmp/analysis.json').read_text())
          candles = json.loads(Path('/tmp/candles.json').read_text())
          tickers = json.loads(Path('/tmp/tickers.json').read_text())
          profile = json.loads(Path('/tmp/profile.json').read_text())
          compare = json.loads(Path('/tmp/compare.json').read_text())
          council_status = json.loads(Path('/tmp/council-status.json').read_text())
          stack_status = json.loads(Path('/tmp/status.json').read_text())
          dumped_status = json.dumps(stack_status).lower()
          assert health.get('status') == 'ok', health
          assert health.get('dependencies', {}).get('postgres') == 'not_provisioned', health
          assert isinstance(market.get('data'), list) and market['data'], market
          assert market.get('source') in allowed_sources, market
          assert 'stale' in market and 'last_live_at' in market and 'fallback_reason' in market, market
          assert 'coverage_note' in market, market
          assert 'coinmarketcap' in market.get('coverage_note', '').lower(), market
          assert 'coverage_target' in market, market
          assert isinstance(market.get('partial'), bool), market
          assert global_overview.get('source') in allowed_sources, global_overview
          assert 'stale' in global_overview, global_overview
          assert movers.get('source') in allowed_sources, movers
          assert 'stale' in movers, movers
          assert brief.get('data_source') in allowed_sources, brief
          assert 'not financial advice' in brief.get('disclaimer', '').lower(), brief
          assert analysis.get('asset', {}).get('id') == 'bitcoin', analysis
          assert analysis.get('data_source') in allowed_sources, analysis
          assert isinstance(candles.get('data'), list) and candles['data'], candles
          candle = candles['data'][0]
          assert all(key in candle for key in ('timestamp','open','high','low','close')), candle
          assert tickers.get('source') in allowed_sources, tickers
          assert isinstance(tickers.get('data'), list), tickers
          assert isinstance(tickers.get('unique_exchange_count'), int), tickers
          assert 'invent' in tickers.get('note', '').lower() or 'scrape' in tickers.get('note', '').lower() or tickers['data'], tickers
          assert tickers.get('sort') == 'trust', tickers
          dumped_tickers = json.dumps(tickers).lower()
          assert 'api_key' not in dumped_tickers, tickers
          assert profile.get('source') in allowed_sources, profile
          assert isinstance(profile.get('links'), list), profile
          assert all(isinstance(item, dict) and str(item.get('url','')).startswith(('http://','https://')) for item in profile['links']), profile
          dumped_profile = json.dumps(profile).lower()
          assert 'javascript:' not in dumped_profile, profile
          assert 'api_key' not in dumped_profile, profile
          assert 'invent' in profile.get('note','').lower() or 'scrape' in profile.get('note','').lower() or profile['links'], profile
          assert isinstance(compare.get('data'), list), compare
          assert compare.get('source') in allowed_sources, compare
          assert 'not-a-real-coin' in compare.get('missing', []), compare
          assert 'invent' in compare.get('note', '').lower(), compare
          dumped_compare = json.dumps(compare).lower()
          assert 'api_key' not in dumped_compare, compare
          assert isinstance(compare.get('ids'), list) and len(compare['ids']) <= 3, compare
          assert council_status.get('enabled') is True, council_status
          assert council_status.get('supported', 0) >= 9, council_status
          providers = {item['provider']: item for item in council_status.get('providers', [])}
          assert 'xai' in providers, council_status
          assert providers['xai'].get('label') == 'xAI Grok', providers['xai']
          assert providers['xai'].get('model') == 'grok-4.6', providers['xai']
          assert providers['xai'].get('optional') is True, providers['xai']
          assert providers['xai'].get('configured') is False, providers['xai']
          assert providers['xai'].get('endpoint') == 'https://api.x.ai/v1/chat/completions', providers['xai']
          assert stack_status.get('status') == 'ok', stack_status
          assert stack_status.get('postgres') == 'not_provisioned', stack_status
          assert stack_status.get('market', {}).get('provider') == 'coingecko', stack_status
          assert stack_status.get('market', {}).get('observed') is True, stack_status
          assert stack_status.get('market', {}).get('source') in allowed_sources, stack_status
          assert isinstance(stack_status.get('market', {}).get('key_configured'), bool), stack_status
          assert 'sk-' not in dumped_status and 'api_key' not in dumped_status, stack_status
          assert 'not financial advice' in stack_status.get('disclaimer', '').lower(), stack_status
          print('API, markets, brief, candle, status and AI Council smoke tests passed')
          PY

      - name: Smoke test web application
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if ! curl -fsS http://127.0.0.1:3000/ > /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! grep -q "CoinVigil" /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! grep -qi "not financial advice" /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! grep -q "AI MARKET BRIEF" /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! grep -q "CRYPTOCURRENCY RANKINGS" /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! grep -q "FIND AN ASSET" /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! grep -q "#chart-lab" /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! grep -q "Compare" /tmp/web.html || ! grep -q "/compare?ids=" /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! grep -q "COMPARE" /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! grep -q "Search name, symbol, or id" /tmp/web.html && ! grep -q "market-search" /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! grep -q "Last updated" /tmp/web.html && ! grep -q "Last live" /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! grep -q "xAI Grok" /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! grep -q "Saved in this browser" /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! grep -q "Open Compare" /tmp/web.html && ! grep -q "Compare watched" /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! grep -q "#overview" /tmp/web.html || ! grep -q "#contracts" /tmp/web.html; then
              sleep 2
              continue
            fi
            if ! curl -fsS http://127.0.0.1:3000/asset/bitcoin > /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! grep -q "EXCHANGE MARKETS" /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! grep -q "Filter exchange or pair" /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! grep -q "sort-button" /tmp/bitcoin.html && ! grep -q "Sort by" /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! grep -q "/compare?ids=" /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! grep -q "does not scrape" /tmp/bitcoin.html && ! grep -q "pairs on CoinGecko" /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! grep -q "Circulating" /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! grep -q "Vol / Mkt cap" /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! grep -q ">ATH<" /tmp/bitcoin.html && ! grep -q "ATH" /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! grep -q "LINKS / COMMUNITY" /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! grep -q "ABOUT" /tmp/bitcoin.html && ! grep -q "Genesis date" /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! grep -qi "no platform contracts" /tmp/bitcoin.html && ! grep -q "CONTRACTS" /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! grep -q 'id="contracts"' /tmp/bitcoin.html && ! grep -q 'id=contracts' /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! grep -q "Website" /tmp/bitcoin.html && ! grep -q "Explorers" /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! grep -q "#chart-lab" /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! grep -q "noopener noreferrer" /tmp/bitcoin.html && ! grep -qi "Not listed" /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! grep -qi "does not scrape social" /tmp/bitcoin.html && ! grep -qi "does not invent URLs" /tmp/bitcoin.html; then
              sleep 2
              continue
            fi
            if ! curl -fsS http://127.0.0.1:3000/token-studio > /tmp/token-studio.html; then
              sleep 2
              continue
            fi
            if ! grep -q "Token Studio" /tmp/token-studio.html; then
              sleep 2
              continue
            fi
            if ! curl -fsS http://127.0.0.1:3000/news > /tmp/news.html; then
              sleep 2
              continue
            fi
            if ! grep -q "Intelligence feed" /tmp/news.html && ! grep -q "INTELLIGENCE FEED" /tmp/news.html; then
              sleep 2
              continue
            fi
            if ! curl -fsS http://127.0.0.1:3000/status > /tmp/status.html; then
              sleep 2
              continue
            fi
            if ! grep -q "STACK STATUS" /tmp/status.html; then
              sleep 2
              continue
            fi
            if ! grep -q "Not provisioned" /tmp/status.html; then
              sleep 2
              continue
            fi
            if ! grep -q "does not call CoinGecko" /tmp/status.html && ! grep -q "never stamps the public API" /tmp/status.html; then
              sleep 2
              continue
            fi
            if ! grep -q "CoinGecko key" /tmp/status.html && ! grep -q "key is configured" /tmp/status.html; then
              sleep 2
              continue
            fi
            if ! curl -fsS "http://127.0.0.1:3000/compare?ids=bitcoin,ethereum" > /tmp/compare.html; then
              sleep 2
              continue
            fi
            if ! grep -q "SIDE-BY-SIDE" /tmp/compare.html; then
              sleep 2
              continue
            fi
            if ! grep -qi "does not invent" /tmp/compare.html; then
              sleep 2
              continue
            fi
            if ! grep -q "7d spark" /tmp/compare.html && ! grep -q "sparkline" /tmp/compare.html; then
              sleep 2
              continue
            fi
            if ! grep -q "#chart-lab" /tmp/compare.html; then
              sleep 2
              continue
            fi
            if ! grep -q "Copy URL" /tmp/compare.html && ! grep -q "watchlist" /tmp/compare.html; then
              sleep 2
              continue
            fi
            echo "Web, Chart Lab, Token Studio, News, Status and Compare smoke tests passed"
            exit 0
          done
          exit 1

      - name: Verify running services
        run: docker compose ps

      - name: Print container logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=300 || true

      - name: Clean up
        if: always()
        run: docker compose down -v --remove-orphans
